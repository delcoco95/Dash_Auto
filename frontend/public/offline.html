<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors connexion — Dash Auto</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 360px; }
    .icon {
      width: 64px; height: 64px; border-radius: 20px;
      background: #0d532a; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #777777; margin: 0 0 20px; }
    button {
      border: none; background: #0d532a; color: #fff;
      padding: 10px 20px; border-radius: 9999px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12l2 2 4-4" />
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>Impossible de charger cette page. Vérifiez votre connexion internet puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
