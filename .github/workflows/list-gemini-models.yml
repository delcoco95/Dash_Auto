name: Lister les modèles Gemini disponibles

on:
  workflow_dispatch: {}

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r email_automation/requirements.txt

      - run: python email_automation/list_gemini_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
